# Tiny Tapeout project information
project:
  title:        "Tron"  # Project title
  author:       "Matt Venn & Claude"
  discord:      "mattvenn" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Four player light cycles on VGA, raced against the beam"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000 # 800x600@60 pixel clock

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x2"          # Not hardened yet; the 64x16 trail ring alone is 1024 flops. Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mattvenn_tron"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_mattvenn_tron.v"
    - "tron.v"
    - "trail_drum.v"
    - "hvsync_generator.v"
    - "gamepad_pmod.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "speed[0]"
  ui[1]: "speed[1]"
  ui[2]: ""
  ui[3]: ""
  ui[4]: "gamepad latch"
  ui[5]: "gamepad clock"
  ui[6]: "gamepad data"
  ui[7]: ""

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
